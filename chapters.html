<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#17130e">
<title>목차 — 봉황동 석사자</title>
<meta name="description" content="봉황동 석사자 디지털 헤리티지 프로젝트의 서책형 목차 페이지.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Song+Myung&display=swap" rel="stylesheet">
<style>
:root{font-family:'Gowun Batang',Batang,serif;color:#2a241b;background:#17130e;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;min-height:100svh;background:#17130e}
a{color:inherit;text-decoration:none}
a:focus-visible{outline:1px solid currentColor;outline-offset:7px}
.page{min-height:100svh;display:grid;place-items:center;padding:5.5vh 4vw;position:relative;overflow:hidden;background:radial-gradient(circle at 50% 45%,#332b20 0,#211b14 45%,#17130e 100%)}
.topbar{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:24px 3.5vw;color:#e8dfcc;z-index:10;font-size:11px;letter-spacing:.1em}
.back{padding:10px 0;border-bottom:1px solid transparent}
.back:hover{border-bottom-color:#e8dfcc77}
.project{opacity:.62}
.book{width:min(1180px,92vw);min-height:min(760px,84svh);display:grid;grid-template-columns:1fr 1fr;position:relative;box-shadow:0 35px 90px #0008,0 5px 14px #0006;transform:perspective(1800px) rotateX(.7deg)}
.book:before{content:'';position:absolute;inset:0;pointer-events:none;z-index:3;box-shadow:inset 0 0 0 1px #6d5c4435,inset 0 0 60px #6b57351f}
.book:after{content:'';position:absolute;top:0;bottom:0;left:50%;width:34px;transform:translateX(-50%);z-index:4;pointer-events:none;background:linear-gradient(90deg,transparent,#5a493626 28%,#3f342548 49%,#f4e8ca25 56%,transparent)}
.leaf{position:relative;padding:clamp(52px,7vw,96px);background:
radial-gradient(circle at 18% 24%,#6d59460a 0 1px,transparent 1.7px),
radial-gradient(circle at 72% 68%,#6d594508 0 1px,transparent 1.8px),
linear-gradient(90deg,#e9ddbf,#f1e6ca 18%,#f4ead2 82%,#e8dabb);
background-size:19px 23px,29px 31px,100% 100%}
.left-leaf{display:flex;flex-direction:column;justify-content:space-between;border-right:1px solid #745f3e25}
.kicker{font-size:11px;letter-spacing:.18em;color:#5a4d3b}
.title-wrap{display:flex;align-items:flex-start;gap:34px;margin:auto 0}
.vertical-title{writing-mode:vertical-rl;font-family:'Song Myung','Gowun Batang',Batang,serif;font-size:clamp(46px,5vw,72px);font-weight:400;letter-spacing:.18em;line-height:1;margin:0}
.english{font-size:11px;line-height:1.8;letter-spacing:.2em;color:#6b5c45;margin-top:5px}
.seal{width:46px;height:46px;border:1px solid #8d3e30;color:#8d3e30;display:grid;place-items:center;font-family:'Song Myung',serif;font-size:18px;line-height:1;transform:rotate(-2deg);opacity:.8}
.meta{font-size:12px;line-height:1.9;color:#655944}
.right-leaf{display:flex;flex-direction:column}
.index-head{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:1px solid #3d34283c;padding-bottom:18px;margin-bottom:12px}
.index-head h1{margin:0;font-family:'Song Myung','Gowun Batang',Batang,serif;font-size:26px;font-weight:400;letter-spacing:.1em}
.index-head span{font-size:10px;letter-spacing:.16em;color:#75674f}
.chapters{list-style:none;padding:0;margin:0}
.chapter{border-bottom:1px solid #4a3d2b26}
.chapter a,.chapter .disabled{display:grid;grid-template-columns:76px 1fr auto;gap:18px;align-items:center;padding:24px 0}
.num{font-family:'Song Myung','Gowun Batang',Batang,serif;font-size:13px;letter-spacing:.08em;color:#7c6b50}
.name{font-family:'Song Myung','Gowun Batang',Batang,serif;font-size:clamp(18px,1.75vw,25px);font-weight:400;line-height:1.55;transition:transform .25s ease}
.state{font-size:9px;letter-spacing:.12em;color:#87785f;white-space:nowrap}
.chapter a:hover .name{transform:translateX(6px)}
.chapter a:hover .state{color:#8d3e30}
.disabled{opacity:.5;cursor:default}
.book-note{margin-top:auto;padding-top:30px;font-size:12px;line-height:1.9;color:#74664f;max-width:34em}
@media(max-width:820px){
 .page{padding:72px 18px 28px;align-items:start}
 .topbar{padding:18px 20px}
 .project{display:none}
 .book{grid-template-columns:1fr;width:100%;min-height:auto}
 .book:after{display:none}
 .left-leaf{min-height:34svh;padding:42px 34px;border-right:0;border-bottom:1px solid #745f3e25}
 .title-wrap{margin:40px 0 28px;justify-content:space-between}
 .vertical-title{writing-mode:horizontal-tb;font-size:44px;letter-spacing:.08em}
 .right-leaf{padding:42px 34px 50px}
 .chapter a,.chapter .disabled{grid-template-columns:60px 1fr;gap:12px;padding:21px 0}
 .state{grid-column:2}
}
</style>
</head>
<body>
<div class="page">
  <header class="topbar">
    <a class="back" href="./#intro">← 돌아가기</a>
    <span class="project">공주 봉황동 석사자 · 목차</span>
  </header>

  <main class="book" aria-label="봉황동 석사자 프로젝트 목차">
    <section class="leaf left-leaf" aria-labelledby="bookTitle">
      <p class="kicker">公州 · 鳳凰洞</p>
      <div class="title-wrap">
        <div>
          <h1 class="vertical-title" id="bookTitle">目次</h1>
          <p class="english">INDEX OF THE EXPERIENCE</p>
        </div>
        <span class="seal" aria-hidden="true">石</span>
      </div>
      <p class="meta">윤정연 · 김문선<br>디지털 헤리티지 프로젝트</p>
    </section>

    <section class="leaf right-leaf">
      <div class="index-head">
        <h1>차례</h1>
        <span>五章</span>
      </div>

      <ol class="chapters">
        <li class="chapter">
          <a href="./#intro">
            <span class="num">第一章</span>
            <span class="name">석사자와의 첫 만남</span>
            <span class="state">들어가기</span>
          </a>
        </li>
        <li class="chapter">
          <div class="disabled" aria-disabled="true">
            <span class="num">第二章</span>
            <span class="name">석사자의 형태를 가까이 관찰</span>
            <span class="state">제작 중</span>
          </div>
        </li>
        <li class="chapter">
          <div class="disabled" aria-disabled="true">
            <span class="num">第三章</span>
            <span class="name">석사자의 형태에서 공주의 마을로</span>
            <span class="state">제작 중</span>
          </div>
        </li>
        <li class="chapter">
          <div class="disabled" aria-disabled="true">
            <span class="num">第四章</span>
            <span class="name">마을에서 만나는 사람들</span>
            <span class="state">제작 중</span>
          </div>
        </li>
        <li class="chapter">
          <div class="disabled" aria-disabled="true">
            <span class="num">第五章</span>
            <span class="name">다시 바라본 마을</span>
            <span class="state">제작 중</span>
          </div>
        </li>
      </ol>

      <p class="book-note">각 장은 석사자의 형태와 공주의 공간, 그리고 마을 사람들의 이야기를 따라 이어집니다.</p>
    </section>
  </main>
</div>
</body>
</html>
