<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ending composition QA</title><style>html,body{margin:0;width:100%;height:100%;background:#f1f1ed}#stage{position:relative;width:100%;height:100%;}#tools{position:fixed;z-index:100;bottom:4px;left:4px;max-width:95vw;padding:4px;background:#fff9;font:13px sans-serif}select{font:inherit}#proof{font-size:11px}</style></head><body><div id="stage"></div><div id="tools"><select id="time"><option value="7">Spring</option><option value="13">Summer children</option><option value="18">Rain</option><option value="29">Autumn</option><option value="39">Winter</option><option value="43.3">Roof dismantle</option><option value="45.2">Cleared site</option><option value="50">Modern night</option><option value="60">Dawn</option><option value="70">Day</option><option value="79.1">Fade complete</option></select><button id="save" type="button">Save frame</button><span id="proof">Loading</span></div><script type="module">
import {createEnding} from './assets/spatial-ending.js';
try{const routes=await fetch('./assets/film-ending/routes.json').then(r=>r.json());const child=await fetch('./assets/film-ending/children-loop.json').then(r=>r.json());const ending=createEnding(document.getElementById('stage'),{camera:routes.endingCamera,children:child.actors,images:{pair:'ending-pair.png',historicBare:'ending-historic-bare.webp'},masks:{branches:'ending-masks/branches.png'}});window.ending=ending;await ending.ready;document.getElementById('save').onclick=()=>{const a=document.createElement('a');a.href=ending.canvas.toDataURL('image/png');a.download='ending-'+ending.proof().phase+'.png';a.click();};const time=document.getElementById('time'),proof=document.getElementById('proof');const start=performance.now();function draw(){ending.update(Number(time.value),(performance.now()-start)/1000);const p=ending.proof();proof.textContent=p.phase+' · children '+p.children.length+' · music '+p.musicGain.toFixed(2);requestAnimationFrame(draw)}draw();}catch(e){document.getElementById('proof').textContent=e.stack;}
</script></body></html>
