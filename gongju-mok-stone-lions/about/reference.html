        <h1>레퍼런스 수집</h1>
        <p class="material-intro">공주목의 공간과 조선시대 건축·생활상을 살펴보는 참고 자료입니다.</p>
      </header>
      <div class="material-gallery">
        <figure class="material-figure">
          <a class="material-image" href="./assets/reference-gongsanji-map.webp" target="_blank" rel="noopener noreferrer" aria-label="공산지의 공주지도 · 원본 크게 보기 (새 탭)"><img src="./assets/reference-gongsanji-map.webp" width="848" height="1200" alt="산과 강, 성곽과 마을의 위치를 그린 공산지의 공주지도" loading="eager" decoding="async"></a>
          <figcaption>
            <h2>공산지 · 공주지도</h2>
            <p>강·산성·마을의 상대적인 위치와 길의 흐름을 살펴봅니다.</p>
            <p class="reference-credit">[공산지 / 공주지도] <a href="https://encykorea.aks.ac.kr/Article/E0004341" target="_blank" rel="noopener noreferrer">한국민족문화대백과사전</a><br>한국학중앙연구원 · 공공누리 제1유형</p>
          </figcaption>
        </figure>
        <figure class="material-figure">
          <a class="material-image" href="./assets/reference-danwon-giwaigi.jpg" target="_blank" rel="noopener noreferrer" aria-label="김홍도 기와이기 · 원본 크게 보기 (새 탭)"><img src="./assets/reference-danwon-giwaigi.jpg" width="3671" height="4312" alt="기와를 올리고 목재를 다듬는 사람들을 그린 김홍도의 기와이기" loading="lazy" decoding="async"></a>
          <figcaption>
            <h2>기와이기 · 건축과 작업</h2>
            <p>기둥·기와·작업 도구와 사람 크기의 관계를 살펴봅니다.</p>
            <p class="reference-credit">김홍도, 『풍속도 화첩』 · 국립중앙박물관 소장<br><a href="https://commons.wikimedia.org/wiki/File:Danwon_Giwaigi.jpg" target="_blank" rel="noopener noreferrer">Wikimedia Commons 원본</a> · Public Domain</p>
          </figcaption>
        </figure>
        <figure class="material-figure">
          <a class="material-image" href="./assets/reference-danwon-haengsang.jpg" target="_blank" rel="noopener noreferrer" aria-label="김홍도 행상 · 원본 크게 보기 (새 탭)"><img src="./assets/reference-danwon-haengsang.jpg" width="1868" height="2158" alt="짐과 바구니를 메고 길에서 만난 사람들을 그린 김홍도의 행상" loading="lazy" decoding="async"></a>
          <figcaption>
            <h2>행상 · 옷차림과 소품</h2>
            <p>짐을 지는 자세와 옷의 형태, 바구니·지팡이 같은 소품을 살펴봅니다.</p>
            <p class="reference-credit">김홍도, 『풍속도 화첩』 · 국립중앙박물관 소장<br><a href="https://commons.wikimedia.org/wiki/File:Danwon_Haengsang.jpg" target="_blank" rel="noopener noreferrer">Wikimedia Commons 원본</a> · Public Domain</p>
          </figcaption>
        </figure>
        <figure class="material-figure">
          <a class="material-image" href="./assets/reference-danwon-jumak.jpg" target="_blank" rel="noopener noreferrer" aria-label="김홍도 주막 · 원본 크게 보기 (새 탭)"><img src="./assets/reference-danwon-jumak.jpg" width="1893" height="2192" alt="주막에서 음식을 준비하고 식사하는 사람들을 그린 김홍도의 주막" loading="lazy" decoding="async"></a>
          <figcaption>
            <h2>주막 · 생활 동작</h2>
            <p>음식을 준비하고 나누는 손동작, 그릇과 부엌 주변의 배치를 살펴봅니다.</p>
            <p class="reference-credit">김홍도, 『풍속도 화첩』 · 국립중앙박물관 소장<br><a href="https://commons.wikimedia.org/wiki/File:Danwon_Jumak.jpg" target="_blank" rel="noopener noreferrer">Wikimedia Commons 원본</a> · Public Domain</p>
          </figcaption>
