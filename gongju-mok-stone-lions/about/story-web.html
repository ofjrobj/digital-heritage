<body class="materials-page story-web-page">
  <a class="skip" href="#material">본문으로 건너뛰기</a>
  <div class="wrap">
    <header class="top">
      <a class="brand" href="../?start=intro"><span class="brand-mark" aria-hidden="true">石</span><span>봉황동 석사자</span></a>
      <a class="material-back" href="./#step-story-web">기획과 제작으로</a>
    </header>
    <main id="material">
      <header class="story-video-header">
        <h1>Story 영상</h1>
        <a href="../?start=intro" target="_blank" rel="noopener noreferrer">Story 열기 ↗</a>
      </header>
      <section class="story-video-gallery" aria-label="Story에 사용한 영상">
        <figure class="story-video">
          <video controls playsinline muted preload="metadata" aria-labelledby="intro-caption">
            <source src="../media/v23/intro-mountain-rush.mp4#t=0.1" type="video/mp4">
          </video>
          <figcaption id="intro-caption">먹선에서 공주목으로</figcaption>
        </figure>
        <figure class="story-video">
          <video controls playsinline muted preload="metadata" aria-labelledby="lions-caption">
            <source src="../media/v17/return-lions.mp4#t=0.1" type="video/mp4">
          </video>
          <figcaption id="lions-caption">두 석사자와의 만남</figcaption>
        </figure>
        <figure class="story-video">
          <video controls playsinline muted preload="metadata" aria-labelledby="seasons-caption">
            <source src="../media/v17/seasons.mp4#t=1.5" type="video/mp4">
          </video>
          <figcaption id="seasons-caption">사계절</figcaption>
        </figure>
      </section>
    </main>
    <footer class="material-footer">
      <a href="./#step-story-web">기획과 제작으로 돌아가기</a>
      <p>© 2026 가치해석 1팀 사자성어</p>
    </footer>
  </div>
<script>
  const videos = [...document.querySelectorAll('.story-video video')];
  for (const video of videos) video.addEventListener('play', () => {
    for (const other of videos) if (other !== video) other.pause();
  });
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) videos.forEach(video => video.pause());
  });
</script>
</body>
