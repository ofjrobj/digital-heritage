<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Blender 공간·카메라 검토</title><style>html,body{margin:0;overflow:hidden;background:#101710;color:#e5e7df;font:14px sans-serif}header{position:fixed;z-index:20;left:24px;top:20px;padding:14px;background:#101710d9;border-radius:8px;max-width:calc(100vw - 76px)}select,input,button{font:inherit;accent-color:#a7b6a2}select,button{padding:6px;margin:6px;border:1px solid #83927e;background:#172318;color:inherit;border-radius:4px}label{display:block;margin-top:8px}input{width:260px;max-width:60vw}output{display:block;font-size:12px;margin-top:8px}a{color:inherit}</style><script type="importmap">{"imports":{"three":"./assets/vendor/three.module.js"}}</script><body data-stage="village"><header><b>Blender 공간·카메라 검토</b><br><select id="route" aria-label="장소"><option>제금루 · 장사꾼</option><option>동헌 · 농민</option><option>객사 · 찬모</option><option>민가 · 주민 삼총사</option><option>뒷산 · 나무꾼</option><option>시간의 풍경 · 환경 형성</option></select><label>스크롤 또는 진행 막대로 관찰<input id="time" type="range" aria-label="카메라 진행" min="0" max="144" step=".1" value="0"></label><output id="readout">Blender 데이터를 불러오는 중…</output><p style="font-size:12px">동선 검토용 모델 · 고증 복원도 아님 · 힉사필드 미사용</p><a href="./#intro">전체 웹으로 돌아가기</a></header><script type="module">await import('./assets/blender-spatial-view.js?v=30');const choice=document.querySelector('#route'),slider=document.querySelector('#time'),out=document.querySelector('#readout');function draw(){const i=choice.selectedIndex,t=Number(slider.value);if(i===5){document.body.dataset.stage='memory';document.dispatchEvent(new CustomEvent('blender-ending-frame',{detail:t/144}));out.textContent=`시간의 풍경 ${Math.round(t/144*100)}%`;}else{document.body.dataset.stage='village';document.dispatchEvent(new CustomEvent('blender-route-frame',{detail:{index:i,time:t}}));out.textContent=`${t.toFixed(1)} / 144초 · ${t<90?'마을을 통과하는 진입':t<114?'인물 주변 연속 관찰':'다른 길을 통한 퇴장'}`;}}choice.onchange=()=>{slider.value=0;draw()};slider.oninput=draw;window.addEventListener('wheel',e=>{e.preventDefault();slider.value=Math.max(0,Math.min(144,Number(slider.value)+Math.max(-100,Math.min(100,e.deltaY))*.035));draw()},{passive:false});draw();</script></body></html>
