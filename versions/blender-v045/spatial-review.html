<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>공주 마을 v045 — 공간과 카메라 검토</title><style>body{margin:0;background:#b6bcb5;font:15px sans-serif}nav{position:fixed;z-index:30;bottom:15px;left:3%;width:94%;box-sizing:border-box;background:#ffffffe8;padding:14px;border-radius:10px}input{width:55%}button,select,a{margin:4px;padding:7px}#note{font-size:12px;margin:6px}</style><script type="importmap">{"imports":{"three":"./assets/vendor/three.module.js"}}</script><body data-stage="terrain"><nav><select id="route"><option>제금루 · 장사꾼</option><option>동헌 · 농민</option><option>객사 · 찬모</option><option>민가 · 주민</option><option>뒷산 · 나무꾼</option><option>객사 앞 석사자 · 계절 · 현재</option></select><button id="play">동선 재생</button><input id="time" aria-label="카메라 시간" type="range" min="0" max="144" step="0.1" value="0"><output id="clock">0.0초</output><a href="./">전체 웹 보기</a><div id="note">인물 확대 · 장소별 동선 · 엔딩: 70초 정지 / 78–114초 계절 / 119초 현재 현장(사진 참고 모델)</div></nav><script type="module">import './assets/blender-spatial-view.js';let running=false,last=0;const slider=document.querySelector('#time'),route=document.querySelector('#route');function update(){document.querySelector('#clock').textContent=Number(slider.value).toFixed(1)+'초';document.body.dataset.stage=route.selectedIndex===5?'memory':'terrain';if(route.selectedIndex===5){document.dispatchEvent(new CustomEvent('blender-ending-frame',{detail:Number(slider.value)/144}));return;}document.dispatchEvent(new CustomEvent('blender-route-frame',{detail:{index:route.selectedIndex,time:Number(slider.value),opacity:1}}));}slider.oninput=update;route.onchange=()=>{slider.value=0;update()};document.querySelector('#play').onclick=()=>{running=!running;document.querySelector('#play').textContent=running?'일시 정지':'동선 재생'};function tick(t){if(running&&last){slider.value=Math.min(144,Number(slider.value)+(t-last)/1000);update();if(Number(slider.value)>=144)running=false}last=t;requestAnimationFrame(tick)}update();requestAnimationFrame(tick);</script></body></html>
