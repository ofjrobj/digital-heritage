<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>시범 컷 — 봉황동 석사자</title><link rel="stylesheet" href="assets/refined-ui.css?v=full-12"><style>body{margin:0;background:#030303;color:#889f8a;padding:35px}a{color:inherit}h1{font-size:28px}main{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}video{width:100%;aspect-ratio:16/9;background:#111}h2{font-size:14px}@media(max-width:650px){main{grid-template-columns:1fr}}</style></head><body><a href="./#intro">← 경험으로</a><h1>시범 컷</h1><main></main><script type="module">const m=await fetch('assets/full-prototype-v012.json').then(r=>r.json()),names=['제금루 · 장사꾼','동헌 · 농민','객사 · 찬모','민가 · 주민','뒷산 · 나무꾼','고려 · 봄','고려 · 여름','고려 · 가을','고려 · 겨울','조선 · 봄','조선 · 여름','조선 · 가을','조선 · 겨울','현재 · 여름'];for(const s of m.scenes){const article=document.createElement('article'),v=document.createElement('video');v.controls=true;v.muted=true;v.playsInline=true;v.preload='auto';v.src=s.url;v.addEventListener('loadeddata',()=>v.currentTime=.5,{once:true});article.append(v);const title=document.createElement('h2');title.textContent=names[s.index];article.append(title);document.querySelector('main').append(article);}</script></body></html>
